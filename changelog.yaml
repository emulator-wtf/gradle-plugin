# To-be-released changelog collection file
# When making changes that should get reflected in the changelog, add them to one of the sections below, example:
# unreleased:
# - "Made `thingamajig` faster, read more [here](https://example.com)."
#
# (Markdown is supported and encouraged)
unreleased:
- |
  Maintenance: bumped default `ew-cli` version to 1.6.0.
- |
  New: the Gradle plugin now prints warnings about the test run, e.g. when a captured video was too large and was dropped.
- |
  New (private beta): the Gradle plugin now supports running Maestro tests with `ew-cli maestro run`. This feature is currently in private beta, reach out to us at support@emulator.wtf if you are interested in trying it out.
